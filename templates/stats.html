<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "WenQuanYi Zen Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #D9EDFC 0%, #A9CFEC 100%);
    padding: 28px;
    min-height: 100vh;
  }
  .card {
    width: 680px;
    margin: 0 auto;
    background: rgba(255,255,255,0.88);
    border-radius: 16px;
    padding: 30px 26px;
    box-shadow: 0 12px 32px rgba(110,150,190,0.22);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .header { text-align: center; margin-bottom: 22px; }
  .title {
    font-size: 30px;
    font-weight: 700;
    color: #4A85BC;
    letter-spacing: 2px;
  }
  .subtitle { font-size: 14px; color: #6FA6D6; margin-top: 6px; }
  .row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    margin: 7px 0 2px 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.55);
    transition: transform .2s;
  }
  .row.gold   { background: linear-gradient(90deg, #FFF3B0, #FFE17A); box-shadow: 0 4px 14px rgba(255,200,50,0.45); }
  .row.silver { background: linear-gradient(90deg, #F2F2F2, #DCDCDC); box-shadow: 0 4px 12px rgba(160,160,160,0.35); }
  .row.bronze { background: linear-gradient(90deg, #FFE0CC, #F5B78A); box-shadow: 0 4px 12px rgba(205,127,50,0.35); }
  .rank {
    width: 40px;
    font-size: 22px;
    font-weight: 700;
    color: #4A85BC;
    text-align: center;
    flex-shrink: 0;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    margin: 0 14px;
    object-fit: cover;
    border: 2px solid #fff;
    background: #eee;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .avatar-ph { width: 48px; height: 48px; border-radius: 50%; margin: 0 14px; background: #eee; flex-shrink: 0; }
  .name {
    flex: 1;
    font-size: 16px;
    color: #3a3a3a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .count {
    font-size: 16px;
    font-weight: 700;
    color: #E74C3C;
    margin: 0 10px;
    white-space: nowrap;
  }
  .percent {
    font-size: 13px;
    color: #888;
    width: 64px;
    text-align: right;
    white-space: nowrap;
  }
  .total { font-size: 14px; color: #4A85BC; margin-top: 10px; }
  .total b { font-size: 19px; color: #E74C3C; font-weight: 700; }
  .bar-wrap {
    height: 8px;
    background: rgba(110,150,190,0.12);
    border-radius: 4px;
    margin: 0 16px 6px 16px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: linear-gradient(90deg, #A8D4F2, #6FA6D6);
    border-radius: 4px;
    min-width: 3px;
  }
  .footer { text-align: center; font-size: 12px; color: #9CC3E4; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">🏆 {{ date_label }}发言排行榜</div>
      <div class="subtitle">{{ group_name }} · Top 10</div>
      <div class="total">📊 {{ date_label }}总消息数 <b>{{ total }}</b> 条</div>
    </div>
    {% for u in users %}
    <div class="row {% if u.rank == 1 %}gold{% elif u.rank == 2 %}silver{% elif u.rank == 3 %}bronze{% endif %}">
      <div class="rank">{{ u.rank }}</div>
      {% if u.avatar_b64 %}
      <img class="avatar" src="{{ u.avatar_b64 }}">
      {% else %}
      <div class="avatar-ph"></div>
      {% endif %}
      <div class="name">{{ u.nickname }}</div>
      <div class="count">{{ u.count }} 条</div>
      <div class="percent">{{ u.percent }}%</div>
    </div>
    <div class="bar-wrap"><div class="bar" style="width: {{ u.percent }}%;"></div></div>
    {% endfor %}
    <div class="footer">🌸 Yuki · 数据仅供参考</div>
  </div>
</body>
</html>
